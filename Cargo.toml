[package]
name = "runcove"
version = "0.2.0"
edition = "2021"
description = "Local dev services, under control."
license = "MIT"
repository = "https://github.com/AbyssWhalen/RunCove"
keywords = ["cli", "port", "network", "debug", "devtools"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.74"
authors = ["RunCove contributors"]
readme = "README.md"
default-run = "runcove"

[[bin]]
name = "runcove"
path = "src/main.rs"

[[bin]]
name = "portpeek"
path = "src/bin/portpeek.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Match manifests to tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "runcove") | .version')"
          desktop_cargo_version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml)"
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          printf 'tag=%s root=%s desktop=%s package=%s tauri=%s\n' \
            "$tag_version" "$cargo_version" "$desktop_cargo_version" "$package_version" "$tauri_version"
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$desktop_cargo_version"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$tauri_version"

  cli:
    name: CLI (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: runcove-cli-linux-x86_64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: runcove-cli-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: runcove-cli-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: runcove-cli-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --bins

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir staging
          cp "target/${{ matrix.target }}/release/runcove" staging/
          cp "target/${{ matrix.target }}/release/portpeek" staging/
          cp README.md CHANGELOG.md LICENSE staging/
          tar -C staging -czf "${{ matrix.archive }}" .

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/runcove.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/portpeek.exe" staging/
          Copy-Item README.md, CHANGELOG.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Windows desktop portable
    needs: validate-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop executable
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
        run: npm run tauri build

      - name: Package portable desktop
        shell: pwsh
        run: |
          $executable = "apps/desktop/src-tauri/target/release/runcove-desktop.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Desktop executable was not produced at $executable"
          }
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item $executable staging/
          Copy-Item README.md, CHANGELOG.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath runcove-desktop-windows-x86_64-portable.zip

      - name: Upload desktop archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: runcove-desktop-windows-x86_64-portable.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [cli, desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          # `--` rather than a `./` prefix on each path: it protects a name starting with
          # `-` just as well, and leaves sha256sum's own `HASH<space><space>name` output
          # already in the shape `sha256sum -c` accepts. The previous version stripped the
          # prefix afterwards with `sed 's# \./#  #'`, which put *three* spaces in every
          # line and made the published file fail `-c` on a perfectly good download.
          sha256sum -- *.zip *.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Prove the file we are about to publish is the file we tell people to check
          # with. Cheap, and the only thing that stops this from silently regressing.
          sha256sum -c SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RunCove $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            --latest

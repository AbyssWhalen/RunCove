[package]
name = "runcove-desktop"
version = "0.4.0"
description = "RunCove Windows desktop application"
authors = ["RunCove contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "runcove_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
glob = "0.3"
open = "5"
runcove = { path = "../../.." }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# The same release profile the root package has carried since the CLI shipped. It has to be
# repeated here rather than inherited: this crate is a separate package, not a member of a
# workspace rooted at the repository, so `[profile.release]` in the root `Cargo.toml` is
# ignored when cargo's build root is this manifest. Without this block the desktop
# executable — the artifact users actually download — was the only shipped binary built
# unstripped and without LTO, which is not what writing those settings once was meant to do.
[profile.release]
strip = true
lto = true
codegen-units = 1
